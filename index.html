<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Demon, Unbound</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      text-align: center;
      padding: 40px;
      margin: 0;
    }

    img {
      max-width: 460px;      /* make cover bigger on desktop */
      max-height: 80vh;      /* keep it from overtaking the viewport */
      width: auto;
      height: auto;
      margin-bottom: 40px;
      animation: fadeIn 1s ease-out;
    }

    p {
      margin: 0 0 20px;
      opacity: 0.9;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 20px;
      flex-wrap: wrap; /* helps on small screens */
    }

    .links a {
      color: #ff7a18;
      text-decoration: none;
      font-size: 1.2em;
    }

    .links a:hover {
      text-decoration: underline;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <!-- Put your actual filename here -->
  <img src="/book-cover.png" alt="Demon, Unbound book cover" />

  <div class="links">
    <a href="https://example.com">Link One</a>
    <a href="https://example.com">Link Two</a>
    <a href="https://example.com">Link Three</a>
  </div>

</body>
</html>
